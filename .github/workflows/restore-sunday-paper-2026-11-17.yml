name: Restore Sunday Paper on November 17, 2026
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Only prove the workflow token can request a Pages build
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '25,30,35,45 14 17 11 *'
permissions:
  contents: write
  pages: write
concurrency:
  group: sunday-paper-one-time-restore-2026-11-17
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ORIGINAL_COMMIT: 25be8b6625effc6729447e00f5a805d0ca5476c0
      VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only && 'true' || 'false' }}
    steps:
      - name: Validate or restore the original curated site
        shell: python
        run: |
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          
          CUTOFF = dt.datetime.fromisoformat('2026-11-17T14:30:00+00:00')
          ORIGINAL = os.environ['ORIGINAL_COMMIT']
          REPO = os.environ['GITHUB_REPOSITORY']
          WORKFLOW = '.github/workflows/restore-sunday-paper-2026-11-17.yml'
          HOLD_MESSAGE = 'Temporarily hold Sunday Paper until 2026-11-17 09:30 EST'
          RESTORE_MESSAGE = 'Restore Sunday Paper after 2026-11-17 09:30 EST'
          TOKEN = os.environ['GH_TOKEN']
          VALIDATE_ONLY = os.environ.get('VALIDATE_ONLY') == 'true'
          
          def api(method, path, data=None):
              url = f'https://api.github.com/repos/{REPO}/{path}'
              req = urllib.request.Request(url, method=method,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': f'Bearer {TOKEN}',
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          
          def get_head():
              sha = api('GET', 'git/ref/heads/main')['object']['sha']
              return sha, api('GET', f'git/commits/{sha}')
          
          def file_map(tree_sha):
              result = api('GET', f'git/trees/{tree_sha}?recursive=1')
              if result.get('truncated'):
                  raise RuntimeError('Refusing a truncated source tree')
              return {item['path']: item for item in result['tree'] if item['type'] != 'tree'}
          
          def request_build(expected_sha):
              pages = api('GET', 'pages')
              if pages.get('build_type') != 'legacy' or pages.get('source') != {'branch': 'main', 'path': '/'}:
                  raise RuntimeError('Pages source changed; refusing to request the wrong build')
              result = api('POST', 'pages/builds', {})
              print(f'Pages build accepted for main {expected_sha}: {result.get("status")}', flush=True)
              # A successful POST proves the workflow token can request the later build.
              # Deployment success is verified separately against the live destination.
          
          original = api('GET', f'git/commits/{ORIGINAL}')
          if VALIDATE_ONLY:
              head_sha, head = get_head()
              request_build(head_sha)
              print('Validation only: no content, ref, Pages configuration, or release time was changed.')
              raise SystemExit(0)
          
          now = dt.datetime.now(dt.timezone.utc)
          if now.date() != CUTOFF.date():
              print('One-time restoration date has passed or has not arrived; no change.')
              raise SystemExit(0)
          remaining = (CUTOFF - now).total_seconds()
          if remaining > 900:
              raise RuntimeError('Refusing restoration more than 15 minutes before cutoff')
          while dt.datetime.now(dt.timezone.utc) < CUTOFF:
              time.sleep(max(0, min(30, (CUTOFF - dt.datetime.now(dt.timezone.utc)).total_seconds())))
          
          head_sha, head = get_head()
          current = file_map(head['tree']['sha'])
          if WORKFLOW not in current:
              raise RuntimeError('Restoration workflow missing from main')
          original_files = file_map(original['tree']['sha'])
          desired_files = dict(original_files)
          desired_files[WORKFLOW] = current[WORKFLOW]
          def signatures(files):
              return {path: (item['mode'], item['type'], item['sha']) for path, item in files.items()}
          if signatures(current) == signatures(desired_files):
              print('Original curated site already restored; retrying its Pages build only.')
              request_build(head_sha)
              raise SystemExit(0)
          
          if head['message'].strip() != HOLD_MESSAGE:
              raise RuntimeError('Main changed since the authorized hold; refusing to overwrite newer work')
          allowed = {'index.html', '404.html', 'CNAME', '.nojekyll', WORKFLOW}
          if set(current) != allowed:
              raise RuntimeError('Main is not exactly the expected holding tree; refusing to overwrite it')
          comparison = api('GET', f'compare/{ORIGINAL}...{head_sha}')
          if comparison['merge_base_commit']['sha'] != ORIGINAL:
              raise RuntimeError('Original publication is not an ancestor of the hold')
          # Recreate the exact original public tree, retaining only this one-time workflow.
          workflow_entry = {key: current[WORKFLOW][key] for key in ('path', 'mode', 'type', 'sha')}
          tree = api('POST', 'git/trees', {'base_tree': original['tree']['sha'], 'tree': [workflow_entry]})
          if signatures(file_map(tree['sha'])) != signatures(desired_files):
              raise RuntimeError('Restored tree differs from the original curated files')
          commit = api('POST', 'git/commits', {'message': RESTORE_MESSAGE, 'tree': tree['sha'], 'parents': [head_sha]})
          # A non-forced update fails if another actor changed main during this run.
          api('PATCH', 'git/refs/heads/main', {'sha': commit['sha'], 'force': False})
          print(f'Original curated files restored at {commit["sha"]}', flush=True)
          request_build(commit['sha'])
